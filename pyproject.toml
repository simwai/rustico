[project]
name = "rustico"
version = "2.0.0"
description = "A Rust-inspired, ergonomic Result type for Python with first-class async support, pattern matching, and a clean API."
readme = "README.md"
requires-python = ">=3.8"
keywords = [
  "result",
  "rust",
  "error-handling",
  "async",
  "pattern-matching",
  "monad",
  "decorator",
  "type-safety",
  "python",
  "functional-programming",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
    "typing_extensions>=4.10,<4.14",
]

[project.license]
text = "MIT"

[[project.authors]]
name = "Simon Waiblinger"
email = "16225108+simwai@users.noreply.github.com"

[project.urls]
Homepage = "https://github.com/simwai/rustico"
Documentation = "https://github.com/simwai/rustico#readme"
Source = "https://github.com/simwai/rustico"
Tracker = "https://github.com/simwai/rustico/issues"

[dependency-groups]
dev = [
    "pyright==1.1.411",
    "ruff>=0.12.1",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.23.0,<0.24.0",
    "pytest-cov>=4.0.0,<5.0.0",
    "coverage>=7.5.0,<7.6.0",
    "pre-commit>=3.5.0",
    "python-semantic-release>=10.6.1",
    "twine>=6.1.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.15",
    "lazydocs>=0.4.8",
    "mkdocs-awesome-pages-plugin>=2.9.2,<2.10.0",
]

[tool.ruff]
target-version = "py38"
exclude = [
  ".git",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
  "__pypackages__",
  "build",
  "dist",
  "node_modules",
  "venv",
  "*.json",
]
line-length = 120
indent-width = 2

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "UP",
  "FA",
  "I",
  "B",
  "ANN",
  "RUF",
  "N",
  "YTT",
  "ASYNC",
  "S",
  "BLE",
  "A",
  "COM",
  "DTZ",
  "EM",
  "EXE",
  "ISC",
  "ICN",
  "G",
  "INP",
  "PIE",
  "PYI",
  "PT",
  "RSE",
  "RET",
  "SLF",
  "SLOT",
  "SIM",
  "TID",
  "INT",
  "ARG",
  "PTH",
  "TD",
  "FIX",
  "ERA",
  "PD",
  "PGH",
  "TRY",
  "FLY",
  "NPY",
  "AIR",
  "PERF",
  "FURB",
  "LOG",
]

ignore = [
  "B008",
  "C901",
  "RUF012",
  "W293",
  "RUF043",
  "COM812",
  "ISC001",
  "ANN401",
  "PYI032",
  "ARG002",
  "RET501",
  "TRY003",
  "EM101",
  "PGH003",
  "E501",
]

fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"src/**/__init__.py" = ["F401"]
"tests/**" = ["ANN", "PT", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
force-single-line = false
combine-as-imports = true

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.pyright]
include = ["src/**"]
pythonVersion = "3.8"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
asyncio_mode = "strict"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
build_command = "pdm build"
commit_author = "simwai <16225108+simwai@users.noreply.github.com>"
commit_message = "chore(release): v{version} [skip ci]"

[tool.semantic_release.changelog]
mode = "init"

[tool.semantic_release.branches.main]
match = "main"

[tool.pdm.scripts]
start = "python -m src.rustico"
lint = "ruff check src/"
format = "ruff format src/"
typecheck = "pyright src"
test = "pytest"
psr-print = "semantic-release version --print"
psr-version-dry = "semantic-release version --no-commit --no-push"
lazydocs-build = "lazydocs --src-base-url=https://github.com/simwai/rustico/tree/main/ --output-path=./docs src/rustico/ --"
mkdocs-build = "mkdocs build"
mkdocs-serve = "mkdocs serve"
upload-testpypi = "twine upload -r testpypi dist/* --skip-existing --config ~/.pypirc"
upload-pypi = "twine upload -r pypi dist/* --skip-existing --config ~/.pypirc"
install-pre-commit = "pre-commit install"

[tool.pdm.scripts.docs]
composite = ["pdm lazydocs-build", "pdm mkdocs-build"]

[tool.pdm.scripts.test-publish]
composite = ["pdm build", "pdm upload-testpypi"]

[tool.pdm.scripts.normal-publish]
composite = ["pdm build", "pdm upload-pypi"]

[tool.pdm.scripts.release]
composite = ["semantic-release version", "pdm upload-testpypi", "pdm upload-pypi"]

[tool.pdm.build]
includes = ["src"]
package-dir = "src"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
